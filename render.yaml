services:
  - type: web
    name: soloma-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx nest build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: API_PREFIX
        value: v1

      # ── Base de données MySQL Aiven ───────────────────────────
      # Valeurs disponibles dans : Aiven Console → votre service → Connection information
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true

      # ── JWT ───────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Mail SMTP ────────────────────────────────────────────
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_ADMIN
        sync: false

      # ── Cloudinary ───────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── CORS ─────────────────────────────────────────────────
      # Mettre l'URL Vercel du frontend après déploiement
      - key: FRONTEND_URL
        sync: false
